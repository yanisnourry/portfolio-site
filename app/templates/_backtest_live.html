{# Live backtest block. Expects `backtest` (BacktestView), `chart` (EquityChart), optional `full`. #}
{% set r = backtest.results %}
<figure class="live{% if full %} live-full{% endif %}">
  <figcaption class="live-head">
    {% if not backtest.live %}
      <span class="status status-warn">Example</span>
      <span class="muted">Live service temporarily unavailable, showing a static example.</span>
    {% elif r.stale %}
      <span class="status status-warn">Live · delayed</span>
      <span class="muted">Last successful refresh {{ r.computed_at | utc }}.</span>
    {% else %}
      <span class="status status-ok">Live</span>
      <span class="muted">Computed {{ r.computed_at | utc }}.</span>
    {% endif %}
  </figcaption>
  <p class="live-title mono">{{ r.data.symbol }} · {{ r.data.timeframe }} · last {{ r.data.bars }} bars · SMA {{ r.strategy.fast }}/{{ r.strategy.slow }}</p>

  {% if chart.points %}
    {% if full %}
    <div class="chart">
      <div class="chart-y mono" aria-hidden="true">
        <span>{{ chart.hi | num }}</span>
        <span>{{ chart.lo | num }}</span>
      </div>
      <svg class="equity" viewBox="0 0 600 120" preserveAspectRatio="none" role="img"
           aria-label="Simulated equity curve from {{ r.data.start | day }} to {{ r.data.end | day }}, total return {{ r.metrics.total_return | pct }}">
        {% if chart.baseline_y is not none %}
        <line class="baseline" x1="0" x2="600" y1="{{ chart.baseline_y }}" y2="{{ chart.baseline_y }}" />
        {% endif %}
        <polyline points="{{ chart.points }}" />
      </svg>
      <div class="chart-x mono" aria-hidden="true">
        <span>{{ r.data.start | day }}</span>
        <span>{{ r.data.end | day }}</span>
      </div>
    </div>
    <p class="chart-note">Equity, starting capital = 1.00{% if chart.baseline_y is not none %} (dashed line){% endif %}. Net of transaction costs.</p>
    {% else %}
    <svg class="sparkline" viewBox="0 0 600 120" preserveAspectRatio="none" role="img"
         aria-label="Simulated equity curve, total return {{ r.metrics.total_return | pct }}">
      <polyline points="{{ chart.points }}" />
    </svg>
    {% endif %}
  {% endif %}

  <dl class="metrics mono">
    <div><dt>Total return</dt><dd>{{ r.metrics.total_return | pct }}</dd></div>
    <div><dt>Max drawdown</dt><dd>{{ r.metrics.max_drawdown | pct }}</dd></div>
    <div><dt>Sharpe (annualized)</dt><dd>{{ r.metrics.sharpe_ratio | num }}</dd></div>
    {% if full %}
    <div><dt>Profit factor</dt><dd>{{ r.metrics.profit_factor | num }}</dd></div>
    <div><dt>Position changes</dt><dd>{{ r.metrics.position_changes }}</dd></div>
    <div><dt>Window</dt><dd>{{ r.data.start | day }} → {{ r.data.end | day }}</dd></div>
    {% endif %}
  </dl>
  <p class="disclaimer">{{ r.disclaimer }}</p>
</figure>
